<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>跑步教練 V4.6.6 (深色大字修正版)</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --primary: #ff6a00; --bg: #f0f2f5; --card: #ffffff; --danger: #e74c3c; --success: #2ecc71; --info: #3498db; --note: #9b59b6; --dark: #2c3e50; }
body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 5px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
h2 { text-align:center; color:var(--primary); margin:5px 0; }
table { width: 100%; border-collapse: collapse; }
td { padding: 6px 2px; border-bottom: 1px solid #eee; text-align: center; }
input { width: 60px; padding: 8px; text-align: center; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; }
.ctrl-row { display: flex; justify-content: space-between; align-items: center; background: #f9f9f9; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; }
.thres-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 5px; border-top: 1px dashed #ccc; }

/* 跑步訓練畫面 - 模擬第二個畫面樣式 */
#trainingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
.status-indicator { font-size: 2.8rem; font-weight: bold; color: var(--success); margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
.phase-info { font-size: 1.6rem; color: #ffeb3b; margin-bottom: 20px; }
.label-small { color: #888; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 5px; }
.big-val { font-size: 6.5rem; font-weight: 900; color: var(--primary); font-family: 'Courier New', monospace; line-height: 1; margin: 10px 0; }

/* 即時門檻修正區塊 */
.live-adjust-box { background: #1a1a1a; padding: 15px; border-radius: 15px; margin: 25px 0; width: 90%; border: 1px solid #333; }
.live-adjust-ctrl { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 10px; }
.btn-adj { background: #333; color: #fff; border: none; width: 60px; height: 60px; border-radius: 10px; font-size: 2rem; font-weight: bold; }
.val-disp { font-size: 2rem; font-weight: bold; color: var(--primary); min-width: 80px; }

/* 下方數據與按鈕 */
.stats-row { display: flex; width: 100%; justify-content: space-around; margin-bottom: 30px; }
.stat-item { flex: 1; }
.stat-val { font-size: 2.5rem; font-family: monospace; font-weight: bold; }
.btn-footer { width: 100%; display: flex; gap: 10px; }
.btn-action { flex: 1; padding: 20px; border: none; border-radius: 15px; font-size: 1.2rem; font-weight: bold; color: #fff; }

/* 螢幕鎖屏層 */
#lockOverlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 20000; flex-direction: column; justify-content: center; align-items: center; }
.lock-hint { color: #fff; background: rgba(255,106,0,0.2); padding: 20px 30px; border-radius: 40px; font-size: 1.2rem; border: 2px solid var(--primary); text-align: center; }

#noteModal, #mapModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30000; justify-content: center; align-items: center; }
#mapModal { background: white; flex-direction: column; }
.note-box { background: white; width: 85%; border-radius: 15px; padding: 20px; }
#noteArea { width: 100%; height: 150px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 1.1rem; box-sizing: border-box; line-height: 1.6; }
#map { flex-grow: 1; width: 100%; }
.history-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
.history-btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
.btn-sm { flex: 1 1 20%; min-width: 60px; padding: 10px 2px; font-size: 12px; border-radius: 6px; border: none; color: white; font-weight: bold; }
</style>
</head>
<body>

<div id="noteModal"><div class="note-box"><h3 style="margin:0; color:var(--note);">📝 編輯跑步備註</h3><textarea id="noteArea"></textarea><div style="display:flex; gap:10px; margin-top:15px;"><button onclick="closeNote()" style="flex:1; padding:12px; background:#888; color:white; border:none; border-radius:8px;">取消</button><button onclick="saveNote()" style="flex:1; padding:12px; background:var(--success); color:white; border:none; border-radius:8px;">儲存</button></div></div></div>
<div id="mapModal"><div style="padding:15px; background:var(--primary); color:white; width:100%; text-align:center; font-weight:bold;">運動軌跡回顧</div><div id="map"></div><button onclick="closeMap()" style="padding:15px; width:100%; background:#444; color:white; border:none; font-size:1.1rem;">關閉地圖</button></div>

<div id="trainingOverlay">
  <div id="lockOverlay" oncontextmenu="return false;">
      <div class="lock-hint">🔒 已鎖定<br><small>長按螢幕 2 秒解鎖</small></div>
  </div>

  <div id="statusTop" class="status-indicator">● 準備中</div>
  <div id="phaseDetail" class="phase-info">節拍器啟動中...</div>
  
  <div class="label-small">累積公里 KM</div>
  <div id="bigDistance" class="big-val">0.000</div>
  
  <div class="live-adjust-box">
      <div class="label-small" style="color:var(--info)">即時 GPS 門檻修正</div>
      <div class="live-adjust-ctrl">
          <button class="btn-adj" onclick="adjThres(-1)">－</button>
          <span class="val-disp liveThresDisp">0.30</span>
          <button class="btn-adj" onclick="adjThres(1)">＋</button>
      </div>
  </div>

  <div class="stats-row">
      <div class="stat-item">
          <div class="label-small">配速</div>
          <div id="bigPace" class="stat-val">--:--</div>
      </div>
      <div class="stat-item">
          <div class="label-small">時間</div>
          <div id="bigElapsed" class="stat-val">00:00</div>
      </div>
  </div>

  <div class="btn-footer">
      <button class="btn-action" style="background: var(--note);" onclick="enableLock()">開啟鎖定</button>
      <button class="btn-action" style="background: var(--danger);" onclick="stopAndSave()">結束並儲存</button>
  </div>
</div>

<div class="card">
  <h2>🏃 跑步教練 V4.6.6</h2>
  <table>
    <thead><tr><th>階段</th><th>BPM</th><th>秒數</th></tr></thead>
    <tbody>
      <tr><td><b>熱身</b></td><td><input type="number" id="bpm0"></td><td><input type="number" id="sec0"></td></tr>
      <tr><td><b>間歇</b></td><td><input type="number" id="bpm1"></td><td><input type="number" id="sec1"></td></tr>
      <tr><td><b>衝刺</b></td><td><input type="number" id="bpm2"></td><td><input type="number" id="sec2"></td></tr>
      <tr><td><b>恢復</b></td><td><input type="number" id="bpm3"></td><td><input type="number" id="sec3"></td></tr>
      <tr><td><b>舒緩</b></td><td><input type="number" id="bpm4"></td><td><input type="number" id="sec4"></td></tr>
    </tbody>
  </table>
  
  <div class="ctrl-row">
    <span>間歇循環：<input id="loopCount" type="number" style="width:40px;"></span>
    <span>步進：<input id="thresholdStep" type="number" step="0.01" style="width:45px;"></span>
    <span>預計 <b id="totalPlanTime" style="color:var(--primary)">0</b> 分</span>
  </div>

  <div class="thres-row">
    <span style="font-weight:bold;">預設 GPS 門檻：<span class="liveThresDisp" style="color:var(--primary)">0.30</span>m</span>
    <div style="display:flex; gap:8px;">
        <button style="padding:8px 15px; border-radius:5px; border:1px solid #ccc; background:#fff;" onclick="adjThres(-1)">－</button>
        <button style="padding:8px 15px; border-radius:5px; border:1px solid #ccc; background:#fff;" onclick="adjThres(1)">＋</button>
    </div>
  </div>
  
  <div style="display:flex; gap:10px;">
      <button onclick="toggleStart(true)" class="btn-action" style="background:var(--primary); margin-top:10px;">1 達標後儲存</button>
      <button onclick="toggleStart(false)" class="btn-action" style="background:var(--info); margin-top:10px;">2 達標後續跑</button>
  </div>
</div>

<div class="card">
    <strong style="display:block; margin-bottom:10px;">歷史紀錄</strong>
    <div id="historyContainer"></div>
</div>

<script>
const HISTORY_KEY = 'run_history_v464'; 
const CONFIG_KEY = 'run_config_v464';
const DEFAULT_BPM = [180, 205, 215, 195, 180];
const DEFAULT_SEC = [180, 60, 60, 120, 180];

let config = { bpm: [...DEFAULT_BPM], sec: [...DEFAULT_SEC], loops: 1, threshold: 0.30, step: 0.01 };
let isRunning = false, totalDist = 0, elapsedSec = 0, currentEditingId = null;
let audioCtx = null, watchId = null, timerId = null, trackPoints = [];
let wakeLock = null;
let currentBeepMode = 'A';
let map = null, polyline = null;
let startNote = { location: "獲取中...", weather: "獲取中..." };

function forceRender() {
    const saved = localStorage.getItem(CONFIG_KEY);
    if (saved) { try { Object.assign(config, JSON.parse(saved)); } catch(e) {} }
    for(let i=0; i<5; i++) {
        document.getElementById('bpm'+i).value = config.bpm[i];
        document.getElementById('sec'+i).value = config.sec[i];
        document.getElementById('bpm'+i).oninput = updateUI;
        document.getElementById('sec'+i).oninput = updateUI;
    }
    document.getElementById('loopCount').value = config.loops;
    document.getElementById('loopCount').oninput = updateUI;
    document.getElementById('thresholdStep').value = config.step;
    document.getElementById('thresholdStep').oninput = updateUI;
    syncThresUI(); calcTotalTime(); renderHistory();
}

function updateUI() {
    for(let i=0; i<5; i++) {
        config.bpm[i] = parseInt(document.getElementById('bpm'+i).value) || 0;
        config.sec[i] = parseInt(document.getElementById('sec'+i).value) || 0;
    }
    config.loops = parseInt(document.getElementById('loopCount').value) || 1;
    config.step = parseFloat(document.getElementById('thresholdStep').value) || 0.01;
    localStorage.setItem(CONFIG_KEY, JSON.stringify(config));
    calcTotalTime();
}

function calcTotalTime() {
    let t = config.sec[0] + ((config.sec[1] + config.sec[2] + config.sec[3]) * config.loops) + config.sec[4];
    document.getElementById('totalPlanTime').innerText = (t/60).toFixed(1);
}

function syncThresUI() { document.querySelectorAll('.liveThresDisp').forEach(el => el.innerText = config.threshold.toFixed(2)); }
function adjThres(dir) { config.threshold += (dir * config.step); syncThresUI(); updateUI(); }

// --- 防誤觸鎖 ---
let lockTimer = null;
function enableLock() { document.getElementById('lockOverlay').style.display = 'flex'; }
const lockLayer = document.getElementById('lockOverlay');
lockLayer.addEventListener('touchstart', (e) => {
    e.preventDefault();
    lockTimer = setTimeout(() => { document.getElementById('lockOverlay').style.display = 'none'; }, 2000); 
});
lockLayer.addEventListener('touchend', () => { clearTimeout(lockTimer); });

// --- 背景與 GPS 邏輯 ---
async function requestWakeLock() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
}

async function toggleStart(isAuto) {
    isRunning = true;
    document.getElementById('trainingOverlay').style.display = 'flex';
    requestWakeLock();
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    
    elapsedSec = 0; totalDist = 0; trackPoints = []; currentBeepMode = 'A';
    timerId = setInterval(() => {
        elapsedSec++;
        document.getElementById('bigElapsed').innerText = formatTime(elapsedSec);
    }, 1000);

    startTrainingFlow(isAuto);
    startGPS();
}

async function startTrainingFlow(isAuto) {
    await runPhase(config.bpm[0], config.sec[0], "熱身");
    for(let j=0; j<config.loops; j++) {
        if(!isRunning) break;
        await runPhase(config.bpm[1], config.sec[1], `間歇 ${j+1}`);
        await runPhase(config.bpm[2], config.sec[2], `衝刺 ${j+1}`);
        await runPhase(config.bpm[3], config.sec[3], `恢復 ${j+1}`);
    }
    if(isRunning) await runPhase(config.bpm[4], config.sec[4], "舒緩");
    if(isRunning && isAuto) stopAndSave();
}

async function runPhase(bpm, sec, label) {
    if(!isRunning || sec <= 0) return;
    document.getElementById('statusTop').innerText = "● " + label;
    let bInt = 60000/bpm;
    let end = Date.now() + (sec * 1000);
    while(Date.now() < end && isRunning) {
        let remaining = Math.round((end - Date.now()) / 1000);
        document.getElementById('phaseDetail').innerText = `節拍 ${bpm} | 剩餘 ${remaining} 秒`;
        playBeep(currentBeepMode === 'A' ? 950 : 1400, 0.8, 0.1);
        await new Promise(r => setTimeout(r, bInt));
    }
}

function playBeep(freq, vol, duration) {
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    o.start(); o.stop(audioCtx.currentTime + duration);
}

function startGPS() {
    if (!navigator.geolocation) return;
    let lastPos = null;
    watchId = navigator.geolocation.watchPosition(pos => {
        const { latitude: lat, longitude: lon, accuracy } = pos.coords;
        if (accuracy < 60) {
            const now = new Date();
            trackPoints.push({lat, lon, time: now.toISOString()});
            if (!lastPos) {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`).then(res=>res.json()).then(d=>startNote.location=d.display_name.split(',')[0]);
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`).then(res=>res.json()).then(d=>startNote.weather=`氣溫 ${d.current_weather.temperature}°C`);
            } else {
                const d = haversine(lastPos.lat, lastPos.lon, lat, lon);
                if (d > config.threshold && d < 50) {
                    let oldKM = Math.floor(totalDist / 1000);
                    totalDist += d;
                    if (Math.floor(totalDist/1000) > oldKM) { currentBeepMode = (currentBeepMode === 'A') ? 'B' : 'A'; }
                    document.getElementById('bigDistance').innerText = (totalDist/1000).toFixed(3);
                    if(totalDist > 5) document.getElementById('bigPace').innerText = formatTime(Math.floor(elapsedSec/(totalDist/1000)));
                }
            }
            lastPos = {lat, lon};
        }
    }, null, { enableHighAccuracy: true });
}

function stopAndSave() {
    isRunning = false; clearInterval(timerId);
    if(wakeLock) wakeLock.release();
    if(watchId) navigator.geolocation.clearWatch(watchId);
    if(totalDist > 0) {
        const records = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        records.unshift({ 
            id: Date.now(), 
            date: new Date().toLocaleString(), 
            dist: (totalDist/1000).toFixed(3), 
            time: formatTime(elapsedSec), 
            points: trackPoints,
            threshold: config.threshold.toFixed(2),
            note: `📍 起點：${startNote.location}\n☀️ 天氣：${startNote.weather}` 
        });
        localStorage.setItem(HISTORY_KEY, JSON.stringify(records));
    }
    location.reload();
}

function renderHistory() {
    const rec = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    document.getElementById('historyContainer').innerHTML = rec.map(r => `
        <div class="history-card">
            <div style="font-size:11px; color:#888;">📅 ${r.date}</div>
            <div style="margin-top:4px;"><b style="font-size:1.2rem; color:var(--primary);">🏃 ${r.dist} km | ⏱️ ${r.time}</b></div>
            <div style="font-size:12px; color:var(--info); margin-bottom:5px;">🛰️ GPS 門檻: ${r.threshold || '0.30'}m</div>
            <div class="history-btns">
                <button class="btn-sm" style="background:var(--info);" onclick="viewTrack(${r.id})">軌跡</button>
                <button class="btn-sm" style="background:var(--note);" onclick="editNote(${r.id})">備註</button>
                <button class="btn-sm" style="background:var(--success);" onclick="editDist(${r.id})">修正</button>
                <button class="btn-sm" style="background:var(--dark);" onclick="exportGPX(${r.id})">匯出</button>
                <button class="btn-sm" style="background:var(--danger);" onclick="deleteRec(${r.id})">刪除</button>
            </div>
        </div>
    `).join('');
}

function exportGPX(id) {
    const r = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(r => r.id === id);
    if (!r.points || r.points.length === 0) return alert("無 GPS 資料");
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="RunCoach" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>${r.date}</name><trkseg>`;
    r.points.forEach(p => { gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time || new Date(r.id).toISOString()}</time></trkpt>`; });
    gpx += `</trkseg></trk></gpx>`;
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `Run_${r.id}.gpx`;
    a.click();
}

function editNote(id) { currentEditingId = id; document.getElementById('noteArea').value = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(r => r.id === id).note; document.getElementById('noteModal').style.display = 'flex'; }
function saveNote() { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)); recs.find(r => r.id === currentEditingId).note = document.getElementById('noteArea').value; localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); closeNote(); renderHistory(); }
function closeNote() { document.getElementById('noteModal').style.display = 'none'; }
function deleteRec(id) { if (confirm("確定刪除？")) { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)).filter(r => r.id !== id); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }
function editDist(id) { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)); let idx = recs.findIndex(r => r.id === id); let newVal = prompt("修正里程 (km):", recs[idx].dist); if(newVal) { recs[idx].dist = parseFloat(newVal).toFixed(3); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }
function viewTrack(id) {
    const r = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(r => r.id === id);
    if (!r.points || r.points.length < 2) return alert("點位不足");
    document.getElementById('mapModal').style.display = 'flex';
    setTimeout(() => {
        if (!map) { map = L.map('map').setView([r.points[0].lat, r.points[0].lon], 16); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
        if (polyline) map.removeLayer(polyline);
        polyline = L.polyline(r.points.map(p => [p.lat, p.lon]), { color: '#ff6a00', weight: 5 }).addTo(map);
        map.fitBounds(polyline.getBounds());
    }, 200);
}
function closeMap() { document.getElementById('mapModal').style.display = 'none'; }
function formatTime(s) { return Math.floor(s/60).toString().padStart(2,'0')+":"+(s%60).toString().padStart(2,'0'); }
function haversine(lat1, lon1, lat2, lon2) { const R = 6371000; const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180; const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); }

window.onload = forceRender;
</script>
</body>
</html>
