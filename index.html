<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>跑步教練 V9.1.6</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --primary: #ff6a00; --bg: #f0f2f5; --card: #ffffff; --danger: #e74c3c; --success: #2ecc71; --info: #3498db; --dark: #2c3e50; --note: #9b59b6; }
body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 5px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
h2 { text-align:center; color:var(--primary); margin:5px 0; font-size: 1.2rem; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { background: #f8f9fa; padding: 8px 2px; border: 1px solid #dee2e6; color: #555; }
td { padding: 6px 2px; border: 1px solid #dee2e6; text-align: center; }
input[type="number"], input[type="text"] { width: 90%; padding: 6px 0; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
.pace-text { color: var(--primary); font-weight: bold; font-family: monospace; font-size: 1.1rem; }
.big-val { font-size: 6rem; font-weight: 900; color: var(--primary); font-family: monospace; line-height: 1; margin: 10px 0; }
.btn-action { padding: 18px; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; color: #fff; cursor: pointer; }
.btn-block { width: 100%; display: block; }
#trainingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
.bottom-bar { position: absolute; bottom: 30px; left: 20px; right: 20px; }
#mapModal, #noteModal, #rescueModal, #dbModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30000; justify-content: center; align-items: center; }
#map { width: 100%; height: 80%; background: white; }
.note-box { background: white; width: 95%; max-height: 85vh; overflow-y: auto; border-radius: 15px; padding: 15px; color: #333; box-sizing: border-box; }
#noteArea, #rescueArea { width: 100%; height: 120px; margin-top: 10px; padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
.history-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
.history-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.btn-sm { flex: 1; min-width: 55px; padding: 8px 2px; font-size: 11px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; }

.bpm-control { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }
.btn-circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff; font-size: 1.5rem; cursor: pointer; }
.hold-btn-container { position: relative; width: 100%; height: 60px; overflow: hidden; border-radius: 15px; }
#holdProgress { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255,255,255,0.3); width: 0%; pointer-events: none; }
.thres-input { width: 50px !important; padding: 4px 0 !important; font-size: 0.9rem !important; text-align: center; margin: 0 2px; }
.ratio-input { width: 45px !important; padding: 4px 0 !important; font-size: 0.9rem !important; text-align: center; margin: 0 2px; }
.mini-btn { padding: 4px 6px; font-size: 0.85rem; }
.inline-check { display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; }
.inline-check input { margin: 0 3px 0 0; }

.db-item { border: 1px solid #ccc; border-radius: 8px; padding: 8px; margin-bottom: 12px; background: #fff; }
.db-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1rem; margin-bottom: 6px; }
.btn-del-phase { background: var(--danger); color: white; border: none; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; }
</style>
</head>
<body>

<div id="dbModal">
    <div class="note-box">
        <h3 style="margin-top:0; color:var(--primary); text-align:center;">跑步計畫資料庫</h3>
        <div id="dbList"></div>
        <button onclick="addDbItem()" style="width:100%; padding:10px; background:var(--info); color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:8px;">＋ 新增預設資料</button>
        <button onclick="exportDataTxt()" style="width:100%; padding:10px; background:var(--note); color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:8px;">💾 匯出至 data.txt 備份</button>
        <button onclick="closeDbModal()" style="width:100%; padding:10px; background:#888; color:white; border:none; border-radius:8px;">關閉</button>
    </div>
</div>

<div id="noteModal"><div class="note-box"><h3>📝 訓練備註</h3><textarea id="noteArea"></textarea><div style="display:flex; gap:10px; margin-top:15px;"><button onclick="closeNote()" style="flex:1; padding:10px;">取消</button><button onclick="saveNote()" style="flex:1; padding:10px; background:var(--success); color:white; border:none; border-radius:8px;">儲存</button></div></div></div>

<div id="rescueModal"><div class="note-box" style="border: 3px solid var(--danger);"><h3 style="color:var(--danger); margin-top:0;">⚠️ 系統儲存失敗！已啟動救回機制</h3><p style="font-size:13px; color:#666;">因手機瀏覽器限制，無法寫入歷史紀錄。<strong>程式已自動將下方數據複製到您的剪貼簿</strong>。</p><textarea id="rescueArea" readonly onclick="this.select()"></textarea><button onclick="forceCloseRescue()" style="width:100%; margin-top:15px; padding:12px; background:var(--dark); color:white; border:none; border-radius:8px; font-weight:bold;">我已另存，關閉視窗</button></div></div>

<div id="mapModal" style="flex-direction:column;"><div id="map"></div><button onclick="closeMap()" style="padding:15px; width:100%; background:#444; color:white; border:none;">關閉軌跡</button></div>

<div id="trainingOverlay">
    <div id="statusTop" style="font-size:2rem; color:var(--success); font-weight:bold;">● 準備中</div>
    <div id="phaseDetail" style="font-size:1.2rem; color:#ffeb3b; margin: 5px 0;">--</div>
    <div id="bigDistance" class="big-val">0.000</div>
    <div id="soundIndicator" style="color:var(--info); font-size:0.9rem;">等待 GPS...</div>
    <div style="display:flex; width:100%; justify-content:space-around; margin: 10px 0; text-align:center;">
        <div><div style="color:#888; font-size:0.8rem;">平均配速</div><div id="bigPaceAvg" style="font-size:1.8rem; font-family:monospace;">--:--</div></div>
        <div><div style="color:#ffeb3b; font-size:0.8rem;">階段配速</div><div id="bigPaceCur" style="font-size:1.8rem; font-family:monospace; color:#ffeb3b;">--:--</div></div>
        <div><div style="color:#888; font-size:0.8rem;">跑步時間</div><div id="bigElapsed" style="font-size:1.8rem; font-family:monospace;">00:00</div></div>
    </div>

    <div class="bpm-control">
        <button class="btn-circle" onclick="adjLiveBPM(-1)">－</button>
        <div style="text-align:center;"><div style="font-size:0.8rem; color:#aaa;">當前節拍</div><div id="liveBPM" style="font-size:1.5rem; font-weight:bold;">180</div></div>
        <button class="btn-circle" onclick="adjLiveBPM(1)">＋</button>
    </div>

    <div class="bottom-bar">
        <div class="hold-btn-container">
            <div id="holdProgress"></div>
            <button id="btnStop" class="btn-action btn-block" style="background:var(--danger); position:relative; z-index:1;" 
                onmousedown="startHold(event)" onmouseup="endHold(event)" onmouseleave="endHold(event)"
                ontouchstart="startHold(event)" ontouchend="endHold(event)" ontouchcancel="endHold(event)">
                長按 1.5 秒結束並儲存
            </button>
        </div>
    </div>
</div>

<div class="card">
  <h2>跑步教練 V9.1.6</h2>
  <div>
      <table>
        <thead><tr><th>階段</th><th>BPM</th><th>秒數</th><th>距離(m)</th><th>跑速</th></tr></thead>
        <tbody id="configRows"></tbody>
      </table>
      <div class="control-row" style="display:flex; justify-content:space-between; align-items:center; margin:10px 0; font-size:12px;">
        <span>循環：<input id="loopStart" type="number" oninput="uiUpdate()" style="width:30px; padding:2px;">階至<input id="loopEnd" type="number" oninput="uiUpdate()" style="width:30px; padding:2px;">階，<input id="loopCount" type="number" oninput="uiUpdate()" style="width:35px; padding:2px;">組</span>
        <span>預計：<b id="totalPlanTime">0</b>分 / <b id="totalPlanDist">0</b>km</span>
      </div>
  </div>

  <div style="display:flex; gap:10px; margin-top:10px;">
      <button onclick="toggleStart(true)" class="btn-action" style="background:var(--primary); flex:1;">1 達標儲存</button>
      <button onclick="toggleStart(false)" class="btn-action" style="background:var(--info); flex:1;">2 達標續跑</button>
  </div>
  <button onclick="openDbModal()" style="width:100%; margin-top:10px; padding:10px; background:#ddd; border:none; border-radius:8px; color:#333; font-size:14px; font-weight:bold;">📂 載入 / 管理預設資料庫</button>

  <div class="control-row" style="border-top:1px dashed #ccc; margin-top:12px; padding-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <span>警示音：</span>
      <label class="inline-check">
        <input type="checkbox" id="alarmToggle" onchange="toggleAlarm(this.checked)">開啟
      </label>
    </div>
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <span>距離比例：</span>
      <button class="mini-btn" onclick="adjRatio(-1)">－</button>
      <input type="number" id="ratioInput" class="ratio-input" step="1" min="1" max="200" oninput="manualRatioChange(this.value)">%
      <button class="mini-btn" onclick="adjRatio(1)">＋</button>
    </div>
  </div>

  <div class="control-row" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
    <span>GPS門檻：</span>
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <button class="mini-btn" onclick="adjThres(-0.01)">－</button>
      <input type="number" id="thresInput" class="thres-input" step="0.01" min="0.01" oninput="manualThresChange(this.value)"> m
      <button class="mini-btn" onclick="adjThres(0.01)">＋</button>
    </div>
  </div>
</div>

<div class="card"><strong>歷史紀錄</strong><div id="historyContainer"></div></div>

<script>
const CONFIG_KEY = 'run_config_v916';
const HISTORY_KEY = 'run_history_v916';
const DB_KEY = 'run_db_v916';

const HARDCODED_DATA_TXT = `10K漸速跑,180,420,1000,180,1080,3000,185,1005,3000,190,945,3000,190,300,1000
超慢跑旋轉功,180,1200,1750,180,1200,1750
6K輕鬆跑,180,420,1000,180,2580,7000
13K漸速跑,180,420,1000,180,360,3000,185,1360,4000,190,1280,4000,190,620,2000
挪威4*4,180,420,1000,190,240,820,180,180,820,180,420,1000
亞索800,180,180,400,190,115,400,180,180,400
6K賽事,190,285,1000,190,295,1000,190,290,1000
10K賽事,180,285,1000,190,299,1000,195,290,1000
半馬賽事,180,1800,5000,185,1725,5000,185,1650,5000,185,1700,5000,190,330,1000`;

let isRunning = false, totalDist = 0, elapsedSec = 0;
let audioCtx = null, timerId = null, watchId = null, trackPoints = [];
let lastDistCheck = 0, distStallCount = 0, currentSoundType = true;
let startNote = { location: "偵測中", weather: "偵測中" };
let lastKmDist = 0, lastKmSec = 0, currentRunningBPM = 180;
let holdTimer = null, holdPercent = 0;

// 保底預設設定
let config = {
    items: [
        { bpm:180, sec:285, dist:1000 },
        { bpm:190, sec:299, dist:1000 },
        { bpm:195, sec:290, dist:1000 }
    ],
    loopStart: 1,
    loopEnd: 3,
    loops: 1,
    threshold: 1.81,
    distRatio: 100,
    alarmOn: true
};

let currentPhaseName = "";
let currentLoopIndex = 0;
let phaseRecords = [];
let currentPhaseStartDist = 0, currentPhaseStartSec = 0;

function getAudioContext() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function init() {
    initDatabase();

    try {
        let saved = localStorage.getItem(CONFIG_KEY);
        if (saved) {
            let parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) {
                config = parsed;
            }
        } else {
            let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
            if (db.length > 0) {
                config.items = JSON.parse(JSON.stringify(db[0].items));
                config.loopStart = db[0].loopStart || 1;
                config.loopEnd = db[0].loopEnd || config.items.length;
                config.loops = db[0].loops || 1;
            }
        }
    } catch(e) {
        console.error("Config load fallback trigger", e);
    }

    // 確保必備屬性存在
    if (!config.items || !Array.isArray(config.items) || config.items.length === 0) {
        config.items = [
            { bpm:180, sec:285, dist:1000 },
            { bpm:190, sec:299, dist:1000 },
            { bpm:195, sec:290, dist:1000 }
        ];
    }

    // 執行 UI 渲染
    renderMainTable();
    fillSettingsForm();
    uiUpdate(); 
    renderHistory();
    
    tryFetchExternalTxt();
}

function initDatabase() {
    try {
        let existingDb = localStorage.getItem(DB_KEY);
        if (!existingDb) {
            let parsedDb = parseTxtToDb(HARDCODED_DATA_TXT);
            localStorage.setItem(DB_KEY, JSON.stringify(parsedDb));
        }
    } catch(e) {
        console.error("DB init error", e);
    }
}

function tryFetchExternalTxt() {
    fetch('data.txt')
        .then(r => r.ok ? r.text() : null)
        .then(txt => {
            if (txt) {
                let parsed = parseTxtToDb(txt);
                if (parsed.length > 0) {
                    localStorage.setItem(DB_KEY, JSON.stringify(parsed));
                }
            }
        })
        .catch(e => {});
}

function parseTxtToDb(txt) {
    let lines = txt.split('\n');
    let db = [];
    lines.forEach(line => {
        line = line.trim();
        if (!line) return;
        let parts = line.split(',');
        if (parts.length < 4) return;
        
        let name = parts[0].trim();
        let items = [];
        for (let i = 1; i < parts.length; i += 3) {
            if (i + 2 < parts.length) {
                items.push({
                    bpm: Number(parts[i]) || 180,
                    sec: Number(parts[i+1]) || 300,
                    dist: Number(parts[i+2]) || 1000
                });
            }
        }
        if (items.length > 0) {
            db.push({
                name: name,
                items: items,
                loopStart: 1,
                loopEnd: items.length,
                loops: 1
            });
        }
    });
    return db;
}

function dbToTxtFormat(db) {
    return db.map(entry => {
        let row = [entry.name];
        entry.items.forEach(it => {
            row.push(it.bpm, it.sec, it.dist);
        });
        return row.join(',');
    }).join('\n');
}

function exportDataTxt() {
    let db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
    let txtContent = dbToTxtFormat(db);
    let blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8;' });
    let a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'data.txt';
    a.click();
}

function renderMainTable() {
    let html = "";
    config.items.forEach((it, i) => {
        let pLabel = `${i+1}階`;
        html += `<tr>
            <td><b>${pLabel}</b></td>
            <td><input type="number" id="bpm_${i}" value="${it.bpm||180}" oninput="uiUpdate()"></td>
            <td><input type="number" id="sec_${i}" value="${it.sec||300}" oninput="uiUpdate()"></td>
            <td><input type="number" id="dist_${i}" value="${it.dist||1000}" oninput="uiUpdate()"></td>
            <td class="pace-text" id="pace_${i}">--</td>
        </tr>`;
    });
    let el = document.getElementById('configRows');
    if (el) el.innerHTML = html;
}

function fillSettingsForm() {
    let elLS = document.getElementById('loopStart');
    let elLE = document.getElementById('loopEnd');
    let elLC = document.getElementById('loopCount');
    let elTH = document.getElementById('thresInput');
    let elRA = document.getElementById('ratioInput');
    let elAL = document.getElementById('alarmToggle');

    if(elLS) elLS.value = config.loopStart || 1;
    if(elLE) elLE.value = config.loopEnd || config.items.length;
    if(elLC) elLC.value = config.loops || 1;
    if(elTH) elTH.value = (config.threshold||1.81).toFixed(2);
    if(elRA) elRA.value = config.distRatio||100;
    if(elAL) elAL.checked = config.alarmOn !== false;
}

function uiUpdate() {
    if(!config.items) return;
    config.items.forEach((it, i) => {
        let b = document.getElementById(`bpm_${i}`), s = document.getElementById(`sec_${i}`), d = document.getElementById(`dist_${i}`);
        if(b) it.bpm = +b.value; 
        if(s) it.sec = +s.value; 
        if(d) it.dist = +d.value;
        
        if(it.sec > 0 && it.dist > 0) {
            let pEl = document.getElementById(`pace_${i}`);
            if(pEl) pEl.innerText = formatTime(Math.floor(it.sec / (it.dist/1000)));
        }
    });

    let totalPhases = config.items.length;
    let elLS = document.getElementById('loopStart'), elLE = document.getElementById('loopEnd'), elLC = document.getElementById('loopCount');
    let lStart = elLS ? Math.max(1, Math.min(totalPhases, +elLS.value||1)) : 1;
    let lEnd = elLE ? Math.max(lStart, Math.min(totalPhases, +elLE.value||totalPhases)) : totalPhases;
    let lCount = elLC ? Math.max(1, +elLC.value||1) : 1;

    config.loopStart = lStart;
    config.loopEnd = lEnd;
    config.loops = lCount;

    let totalPlanSec = 0, totalPlanDist = 0;
    for (let i = 0; i < lStart - 1; i++) {
        if(config.items[i]) { totalPlanSec += config.items[i].sec; totalPlanDist += config.items[i].dist; }
    }
    let loopSec = 0, loopDist = 0;
    for (let i = lStart - 1; i < lEnd; i++) {
        if(config.items[i]) { loopSec += config.items[i].sec; loopDist += config.items[i].dist; }
    }
    totalPlanSec += loopSec * lCount;
    totalPlanDist += loopDist * lCount;
    for (let i = lEnd; i < totalPhases; i++) {
        if(config.items[i]) { totalPlanSec += config.items[i].sec; totalPlanDist += config.items[i].dist; }
    }
    
    let elTPT = document.getElementById('totalPlanTime'), elTPD = document.getElementById('totalPlanDist');
    if (elTPT) elTPT.innerText = (totalPlanSec / 60).toFixed(1);
    if (elTPD) elTPD.innerText = (totalPlanDist / 1000).toFixed(2);
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch(e){}
}

function openDbModal() { renderDbList(); document.getElementById('dbModal').style.display = 'flex'; }
function closeDbModal() { document.getElementById('dbModal').style.display = 'none'; }

function renderDbList() {
    const listContainer = document.getElementById('dbList');
    if (!listContainer) return;
    listContainer.innerHTML = "";
    const db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
    
    db.forEach((entry, idx) => {
        let div = document.createElement('div');
        div.className = 'db-item';
        let rowsHtml = entry.items.map((it, i) => {
            let pace = (it.sec > 0 && it.dist > 0) ? formatTime(Math.floor(it.sec / (it.dist/1000))) : '--';
            return `<tr>
                <td style="display:flex; align-items:center; justify-content:center; gap:2px; border:none; padding:4px 0;">
                    <button class="btn-del-phase" onclick="deleteDbPhase(${idx},${i})" title="刪除此階">✕</button>
                    <b>${i+1}階</b>
                </td>
                <td><input type="number" value="${it.bpm}" onchange="updateDbItem(${idx},${i}, 'bpm', this.value)"></td>
                <td><input type="number" value="${it.sec}" onchange="updateDbItem(${idx},${i}, 'sec', this.value)"></td>
                <td><input type="number" value="${it.dist}" onchange="updateDbItem(${idx},${i}, 'dist', this.value)"></td>
                <td class="pace-text">${pace}</td>
            </tr>`;
        }).join('');
        
        div.innerHTML = `
            <div class="db-header">
                <span><input type="text" value="${entry.name}" style="width:130px; font-weight:bold;" onchange="updateDbName(${idx}, this.value)"></span>
                <div>
                    <button onclick="loadDbItem(${idx})" style="background:var(--success); color:white; border:none; padding:6px 12px; border-radius:5px; font-weight:bold; cursor:pointer;">載入</button>
                    <button onclick="deleteDbItem(${idx})" style="background:var(--danger); color:white; border:none; padding:6px 10px; border-radius:5px; cursor:pointer;">刪除</button>
                </div>
            </div>
            <table>
                <thead><tr><th style="width:25%;">階段</th><th>BPM</th><th>秒數</th><th>距離(m)</th><th>配速</th></tr></thead>
                <tbody>${rowsHtml}</tbody>
            </table>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px;">
                <button onclick="addDbPhase(${idx})" style="padding:4px 8px; background:var(--info); color:white; border:none; border-radius:4px; font-size:12px; cursor:pointer;">＋ 新增階段</button>
                <span>循環：<input type="number" value="${entry.loopStart\vert{}\vert{}1}" style="width:30px; padding:2px;" onchange="updateDbLoopRange(${idx}, 'loopStart', this.value)">階~<input type="number" value="${entry.loopEnd\vert{}\vert{}entry.items.length}" style="width:30px; padding:2px;" onchange="updateDbLoopRange(${idx}, 'loopEnd', this.value)">階，<input type="number" value="${entry.loops\vert{}\vert{}1}" style="width:35px; padding:2px;" onchange="updateDbLoopRange(${idx}, 'loops', this.value)">組</span>
            </div>
        `;
        listContainer.appendChild(div);
    });
}

function updateDbName(idx, val) { let db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx].name = val; localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function updateDbLoopRange(idx, field, val) { let db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx][field] = Math.max(1, Number(val)); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function updateDbItem(idx, phaseIdx, field, val) { let db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx].items[phaseIdx][field] = Number(val); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }

function addDbPhase(idx) { 
    let db = JSON.parse(localStorage.getItem(DB_KEY)); 
    db[idx].items.push({ bpm: 180, sec: 300, dist: 1000 }); 
    db[idx].loopEnd = db[idx].items.length; 
    localStorage.setItem(DB_KEY, JSON.stringify(db)); 
    renderDbList(); 
}

function deleteDbPhase(idx, phaseIdx) { let db = JSON.parse(localStorage.getItem(DB_KEY)); if (db[idx].items.length <= 1) { alert("至少需要保留一個階段！"); return; } db[idx].items.splice(phaseIdx, 1); if (db[idx].loopEnd > db[idx].items.length) db[idx].loopEnd = db[idx].items.length; if (db[idx].loopStart > db[idx].items.length) db[idx].loopStart = db[idx].items.length; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function loadDbItem(idx) { let db = JSON.parse(localStorage.getItem(DB_KEY)); let item = db[idx]; config.items = JSON.parse(JSON.stringify(item.items)); config.loopStart = item.loopStart || 1; config.loopEnd = item.loopEnd || config.items.length; config.loops = item.loops || 1; renderMainTable(); fillSettingsForm(); uiUpdate(); closeDbModal(); }

function addDbItem() { 
    let db = JSON.parse(localStorage.getItem(DB_KEY)); 
    db.push({ 
        name: "新預設計畫", 
        items: [
            { bpm: 180, sec: 300, dist: 1000 },
            { bpm: 180, sec: 300, dist: 1000 }
        ], 
        loopStart: 1, 
        loopEnd: 2, 
        loops: 1 
    }); 
    localStorage.setItem(DB_KEY, JSON.stringify(db)); 
    renderDbList(); 
}

function deleteDbItem(idx) { if(!confirm("確定要刪除這筆預設計畫？")) return; let db = JSON.parse(localStorage.getItem(DB_KEY)); db.splice(idx, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }

function manualThresChange(v) { let num = parseFloat(v); if (!isNaN(num) && num > 0) { config.threshold = num; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } }
function adjThres(v) { config.threshold = Math.max(0.01, parseFloat(((config.threshold||1.81) + v).toFixed(2))); document.getElementById('thresInput').value = config.threshold.toFixed(2); localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
function manualRatioChange(v) { let num = parseInt(v); if (!isNaN(num) && num > 0) { config.distRatio = num; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } }
function adjRatio(v) { config.distRatio = Math.max(1, (config.distRatio||100) + v); document.getElementById('ratioInput').value = config.distRatio; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

async function toggleStart(isAuto) {
    if (isRunning) return; 
    isRunning = true; totalDist = 0; elapsedSec = 0; trackPoints = []; 
    lastDistCheck = 0; distStallCount = 0; lastKmDist = 0; lastKmSec = 0;
    phaseRecords = [];
    currentPhaseName = "";
    
    document.getElementById('trainingOverlay').style.display = 'flex';
    getAudioContext();
    
    timerId = setInterval(() => {
        if (!isRunning) return;
        elapsedSec++;
        document.getElementById('bigElapsed').innerText = formatTime(elapsedSec);
        
        if(totalDist > 5) {
            document.getElementById('bigPaceAvg').innerText = formatTime(Math.floor(elapsedSec/(totalDist/1000)));
            
            let pDiffDist = (totalDist - currentPhaseStartDist) / 1000;
            let pDiffSec = elapsedSec - currentPhaseStartSec;
            if (pDiffDist > 0.003 && pDiffSec > 0) {
                let curPhasePaceSec = Math.floor(pDiffSec / pDiffDist);
                document.getElementById('bigPaceCur').innerText = formatTime(curPhasePaceSec);
            }
        }
        
        if (totalDist <= lastDistCheck && elapsedSec > 10) { 
            distStallCount++; 
            if (distStallCount >= 5) { triggerAlarm(); distStallCount = 0; } 
        } else { lastDistCheck = totalDist; distStallCount = 0; }
    }, 1000);

    startGPS();
    runBeepLoop();

    try {
        let lStart = config.loopStart - 1;
        let lEnd = config.loopEnd - 1;
        let lCount = config.loops || 1;

        for (let i = 0; i < lStart; i++) {
            if (!isRunning) break;
            let item = config.items[i];
            await runPhase(`${i+1}階`, item.sec, item.bpm, 0, 1);
        }

        for (let l = 0; l < lCount; l++) {
            if (!isRunning) break;
            currentLoopIndex = l;
            for (let i = lStart; i <= lEnd; i++) {
                if (!isRunning) break;
                let item = config.items[i];
                await runPhase(`${i+1}階`, item.sec, item.bpm, l, lCount);
            }
        }

        for (let i = lEnd + 1; i < config.items.length; i++) {
            if (!isRunning) break;
            let item = config.items[i];
            await runPhase(`${i+1}階`, item.sec, item.bpm, 0, 1);
        }
        
        if(isRunning) {
            if (isAuto) {
                stopAndSave(); 
            } else {
                document.getElementById('statusTop').innerText = "● 續跑中";
                currentPhaseName = "續跑";
                currentPhaseStartDist = totalDist;
                currentPhaseStartSec = elapsedSec;
                while(isRunning) {
                    document.getElementById('phaseDetail').innerText = `訓練達標 | 續跑中...`;
                    await new Promise(r => setTimeout(r, 1000));
                }
            }
        }
    } catch (err) {
        console.error("訓練流程異常:", err);
    }
}

async function runBeepLoop() {
    while(isRunning) {
        let startTime = Date.now();
        await playBeepTick();
        let execTime = Date.now() - startTime;
        let delay = Math.max(10, (60000 / currentRunningBPM) - execTime);
        await new Promise(r => setTimeout(r, delay));
    }
}

function runPhase(label, sec, bpm, loopIdx, totalLoops) {
    return new Promise((resolve) => {
        if(!isRunning) return resolve();

        document.getElementById('statusTop').innerText = "● " + label;
        currentRunningBPM = bpm;
        document.getElementById('liveBPM').innerText = currentRunningBPM;
        currentSoundType = !currentSoundType;
        
        currentPhaseName = label;
        currentPhaseStartDist = totalDist;
        currentPhaseStartSec = elapsedSec;
        
        let remSec = sec;
        let phaseTimer = setInterval(() => {
            if (!isRunning) {
                clearInterval(phaseTimer);
                return resolve();
            }
            remSec--;
            let loopText = (totalLoops > 1) ? ` (組${loopIdx+1}/${totalLoops})` : '';
            document.getElementById('phaseDetail').innerText = `節拍:${currentRunningBPM}${loopText} \vert{} 剩:${remSec}s`;
            if (remSec <= 0) {
                clearInterval(phaseTimer);
                recordPhaseResult();
                resolve();
            }
        }, 1000);
    });
}

function recordPhaseResult() {
    let pDist = totalDist - currentPhaseStartDist;
    let pSec = elapsedSec - currentPhaseStartSec;
    if (pDist > 0 && pSec > 0) {
        phaseRecords.push({
            name: currentPhaseName,
            loopIdx: currentLoopIndex,
            dist: pDist,
            sec: pSec
        });
    }
}

async function playBeepTick() {
    if(!isRunning) return;
    try {
        const ctx = getAudioContext();
        const o = ctx.createOscillator(), g = ctx.createGain(); 
        o.connect(g); g.connect(ctx.destination);
        let km = Math.floor(totalDist / 1000); 
        if (km > (lastKmDist/1000)) { lastKmDist = km * 1000; lastKmSec = elapsedSec; }
        let isHigh = (km % 2 === 0) ? currentSoundType : !currentSoundType;
        o.type = 'square'; 
        o.frequency.setValueAtTime(isHigh ? 1150 : 850, ctx.currentTime);
        g.gain.setValueAtTime(isHigh ? 0.3 : 0.5, ctx.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        
        o.onended = () => { try { o.disconnect(); g.disconnect(); } catch(e){} };
        o.start(ctx.currentTime); 
        o.stop(ctx.currentTime + 0.1);
        
        document.getElementById('soundIndicator').innerText = `第 ${km+1}k | ${isHigh?'高音':'低音'} \vert{} 里程:${(totalDist/1000).toFixed(3)}k`;
    } catch(e) {}
}

function adjLiveBPM(v) { currentRunningBPM += v; document.getElementById('liveBPM').innerText = currentRunningBPM; }

function triggerAlarm() { 
    if(!config.alarmOn || !isRunning) return;
    try {
        if (navigator.vibrate) navigator.vibrate([400, 150, 400]); 
        const ctx = getAudioContext();
        const o = ctx.createOscillator(), g = ctx.createGain(); 
        o.connect(g); g.connect(ctx.destination); 
        o.frequency.setValueAtTime(1600, ctx.currentTime); 
        o.type = 'sawtooth'; 
        g.gain.setValueAtTime(0.4, ctx.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        
        o.onended = () => { try { o.disconnect(); g.disconnect(); } catch(e){} };
        o.start(ctx.currentTime); 
        o.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

function startHold(e) {
    if(e) {
        e.preventDefault(); 
        if (e.touches && e.touches.length > 1) return; 
    }
    clearInterval(holdTimer); 
    holdPercent = 0;
    document.getElementById('holdProgress').style.width = '0%';
    
    holdTimer = setInterval(() => {
        if (!isRunning) { 
            clearInterval(holdTimer);
            return;
        }
        holdPercent += 4; 
        document.getElementById('holdProgress').style.width = holdPercent + '%';
        if(holdPercent >= 100) { 
            clearInterval(holdTimer); 
            holdPercent = 0;
            document.getElementById('holdProgress').style.width = '0%';
            stopAndSave(); 
        }
    }, 60); 
}

function endHold(e) { 
    if(e) e.preventDefault();
    clearInterval(holdTimer); 
    holdPercent = 0; 
    document.getElementById('holdProgress').style.width = '0%'; 
}

function startGPS() {
    watchId = navigator.geolocation.watchPosition(p => {
        const { latitude: lat, longitude: lon, accuracy } = p.coords;
        if(accuracy < 60) {
            let nowStr = new Date().toISOString();
            if(trackPoints.length === 0) {
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`).then(res=>res.json()).then(d=>startNote.location=d.display_name.split(',')[0]).catch(e=>{});
                fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`).then(res=>res.json()).then(d=>startNote.weather=`${d.current_weather.temperature}°C`).catch(e=>{});
                trackPoints.push({lat, lon, time: nowStr});
            } else {
                let last = trackPoints[trackPoints.length-1], d = haversine(last.lat, last.lon, lat, lon);
                if(d > config.threshold && d < 50) { 
                    let adjustedDist = d * ((config.distRatio || 100) / 100);
                    totalDist += adjustedDist; 
                    document.getElementById('bigDistance').innerText = (totalDist/1000).toFixed(3); 
                    trackPoints.push({lat, lon, time: nowStr}); 
                }
            }
        }
    }, null, {enableHighAccuracy:true});
}

function formatPaceStr(sec) {
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}’${s}`;
}

function stopAndSave() {
    if (!isRunning) return;
    isRunning = false; 
    clearInterval(timerId); 
    timerId = null; 
    navigator.geolocation.clearWatch(watchId);
    
    if (currentPhaseName !== "") {
        recordPhaseResult();
        currentPhaseName = "";
    }

    let optimizedPoints = [];
    if (trackPoints.length > 0) {
        optimizedPoints.push(trackPoints[0]);
        for (let i = 1; i < trackPoints.length; i++) {
            let lastSaved = optimizedPoints[optimizedPoints.length - 1];
            let distDiff = haversine(lastSaved.lat, lastSaved.lon, trackPoints[i].lat, trackPoints[i].lon);
            let timeDiff = (new Date(trackPoints[i].time) - new Date(lastSaved.time)) / 1000;
            
            if (distDiff >= 6.0 || timeDiff >= 12 || i === trackPoints.length - 1) {
                optimizedPoints.push(trackPoints[i]);
            }
        }
    }

    let paceDetailLines = calculatePaceSummary(phaseRecords);
    let paceStrText = paceDetailLines.join('\n');
    let autoNote = `📍地點：${startNote.location}\n🌡氣候：${startNote.weather}\n⚙️門檻：${config.threshold.toFixed(2)}m` + (paceStrText ? `\n${paceStrText}` : ``);

    const runInfo = {
        id: Date.now(), 
        date: new Date().toLocaleString(), 
        dist: (totalDist/1000).toFixed(3), 
        time: formatTime(elapsedSec), 
        points: optimizedPoints, 
        note: autoNote
    };

    if(totalDist > 0) {
        try {
            const recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
            recs.unshift(runInfo);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(recs));
            
            alert(`🎉 訓練達標！紀錄已成功儲存：${runInfo.dist} km`);
            document.getElementById('trainingOverlay').style.display = 'none';
            renderHistory();
        } catch (e) {
            const rescueString = JSON.stringify(runInfo);
            document.getElementById('rescueArea').value = rescueString;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(rescueString).catch(()=>{});
            }
            document.getElementById('rescueModal').style.display = 'flex';
        }
    } else {
        document.getElementById('trainingOverlay').style.display = 'none';
        renderHistory();
    }
}

function calculatePaceSummary(records) {
    if (records.length === 0) return [];

    let groups = {};
    records.forEach(r => {
        if (!groups[r.name]) groups[r.name] = [];
        groups[r.name].push(r);
    });

    let lines = [];
    Object.keys(groups).forEach(pName => {
        let items = groups[pName];
        if (items.length === 1) {
            let avgPaceSec = items[0].sec / (items[0].dist / 1000);
            lines.push(`${pName}：${formatPaceStr(avgPaceSec)}`);
        } else {
            let paces = items.map(it => it.sec / (it.dist / 1000));
            let minPace = Math.min(...paces);
            let maxPace = Math.max(...paces);
            lines.push(`${pName}：${formatPaceStr(minPace)}~${formatPaceStr(maxPace)}`);
        }
    });

    return lines;
}

function forceCloseRescue() {
    document.getElementById('rescueModal').style.display = 'none';
    document.getElementById('trainingOverlay').style.display = 'none';
    renderHistory();
}

function renderHistory() {
    try {
        const recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        let container = document.getElementById('historyContainer');
        if (!container) return;
        container.innerHTML = recs.map(r => `
            <div class="history-card">
                <b>🏃 ${r.dist} km | ${r.time}</b> (${r.date})
                <div style="font-size:11px; color:#666; margin:5px 0; white-space:pre-wrap;">${r.note || '無'}</div>
                <div class="history-btns">
                    <button class="btn-sm" style="background:var(--info);" onclick="viewTrack(${r.id})">軌跡</button>
                    <button class="btn-sm" style="background:var(--note);" onclick="editNote(${r.id})">備註</button>
                    <button class="btn-sm" style="background:var(--success);" onclick="editDist(${r.id})">修正</button>
                    <button class="btn-sm" style="background:var(--dark);" onclick="exportGPX(${r.id})">匯出</button>
                    <button class="btn-sm" style="background:var(--danger);" onclick="deleteRec(${r.id})">刪除</button>
                </div>
            </div>
        `).join('');
    } catch(e) {}
}

function exportGPX(id) {
    const r = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(x=>x.id===id); if(!r || !r.points) return;
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="RunCoach"><trk><trkseg>`;
    r.points.forEach(p => { gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${p.time}</time></trkpt>`; });
    gpx += `</trkseg></trk></gpx>`;
    const blob = new Blob([gpx], {type: 'application/gpx+xml'}), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Run_${r.id}.gpx`; a.click();
}

let curEditId = null;
function editNote(id) { curEditId = id; const r = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(x=>x.id===id); document.getElementById('noteArea').value = r.note||""; document.getElementById('noteModal').style.display='flex'; }
function saveNote() { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)); recs.find(x=>x.id===curEditId).note = document.getElementById('noteArea').value; localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); closeNote(); renderHistory(); }
function closeNote() { document.getElementById('noteModal').style.display='none'; }
function editDist(id) { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)); let idx = recs.findIndex(x => x.id === id); let newVal = prompt("修正里程 (km):", recs[idx].dist); if(newVal) { recs[idx].dist = parseFloat(newVal).toFixed(3); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }
function toggleAlarm(val){ config.alarmOn = val; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

function formatTime(s) { if(!s||s<=0) return "00:00"; return Math.floor(s/60).toString().padStart(2,'0')+":"+(s%60).toString().padStart(2,'0'); }
function haversine(lat1,lon1,lat2,lon2) { const R=6371000; const dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

let map=null, polyline=null;
function viewTrack(id) {
    const r = JSON.parse(localStorage.getItem(HISTORY_KEY)).find(x=>x.id===id);
    document.getElementById('mapModal').style.display = 'flex';
    setTimeout(() => {
        if (!map) { map = L.map('map').setView([r.points[0].lat, r.points[0].lon], 16); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
        map.invalidateSize(); if (polyline) map.removeLayer(polyline);
        polyline = L.polyline(r.points.map(p => [p.lat, p.lon]), { color: '#ff6a00', weight: 5 }).addTo(map); map.fitBounds(polyline.getBounds());
    }, 300);
}
function closeMap() { document.getElementById('mapModal').style.display = 'none'; }
function deleteRec(id) { if(confirm("刪除紀錄？")) { let recs = JSON.parse(localStorage.getItem(HISTORY_KEY)).filter(x=>x.id!==id); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }

// 雙重啟動機制：DomContentLoaded 或直接觸發，避免載入事件遺失
if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
} else {
    init();
}
