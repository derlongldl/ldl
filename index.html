<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>跑步教練 V5.9 間歇強化版</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:sans-serif;background:#000;color:#fff}
#app{display:flex;flex-direction:column;justify-content:center;align-items:center;height:100vh}
.big{font-size:4rem;color:#ff6a00}
.bottom{position:absolute;bottom:20px;width:90%}
button{padding:12px;border:none;border-radius:10px;font-size:1rem}
</style>
</head>
<body>

<div id="app">
<div id="phase">準備中</div>
<div id="dist" class="big">0.000</div>
<div id="time">00:00</div>
<div id="info">--</div>

<div class="bottom">
<select id="modeSel">
<option value="general">一般</option>
<option value="interval">間歇</option>
</select>

<button id="stopBtn" style="background:red;width:100%">長按結束</button>
</div>
</div>

<script>
let isRunning=true,mode='general';
let elapsed=0,totalDist=0;
let timer,watchId,lastPos=null,points=[];
let audioCtx=new (window.AudioContext||window.webkitAudioContext)();

// 間歇設定（可自行改）
const intervalPlan=[
 {name:'熱身',sec:120,bpm:170},
 {name:'衝刺',sec:60,bpm:200},
 {name:'恢復',sec:90,bpm:160}
];
let loopCount=3;
let stateIndex=0,loopIndex=0,phaseEnd=0;

init();

function init(){
 timer=setInterval(tick,1000);
 startGPS();
 startPhase();
 loop();
}

function tick(){
 elapsed++;
 document.getElementById('time').innerText=format(elapsed);
 updatePhase();
}

function startPhase(){
 if(mode==='interval'){
  stateIndex=0;loopIndex=0;
  setNextPhase();
 } else {
  document.getElementById('phase').innerText='一般跑';
 }
}

function setNextPhase(){
 if(loopIndex>=loopCount){
  stop();return;
 }
 let phase=intervalPlan[stateIndex];
 document.getElementById('phase').innerText=`${phase.name} (${loopIndex+1}/${loopCount})`;
 document.getElementById('info').innerText=`BPM ${phase.bpm}`;
 phaseEnd=Date.now()+phase.sec*1000;
}

function updatePhase(){
 if(mode!=='interval') return;
 if(Date.now()>=phaseEnd){
  stateIndex++;
  if(stateIndex>=intervalPlan.length){
   stateIndex=0;loopIndex++;
  }
  setNextPhase();
 }
}

async function loop(){
 while(isRunning){
  let bpm=getCurrentBPM();
  await beep(bpm);
 }
}

function getCurrentBPM(){
 if(mode==='interval') return intervalPlan[stateIndex].bpm;
 return 180;
}

async function beep(bpm){
 if(!isRunning) return;
 const o=audioCtx.createOscillator();
 const g=audioCtx.createGain();
 o.connect(g);g.connect(audioCtx.destination);
 o.frequency.value=(mode==='interval')?1200:900;
 g.gain.value=0.3;
 o.start();o.stop(audioCtx.currentTime+0.1);
 await sleep(60000/bpm);
}

function sleep(ms){
 return new Promise(r=>{
  const t=setTimeout(r,ms);
  if(!isRunning){clearTimeout(t);r();}
 });
}

function startGPS(){
 watchId=navigator.geolocation.watchPosition(p=>{
  let {latitude,longitude}=p.coords;
  if(lastPos){
   let d=haversine(lastPos.lat,lastPos.lon,latitude,longitude);
   if(d<50){
    totalDist+=d;
    document.getElementById('dist').innerText=(totalDist/1000).toFixed(3);
   }
  }
  lastPos={lat:latitude,lon:longitude};
  points.push({lat:latitude,lon:longitude});
 });
}

function stop(){
 isRunning=false;
 clearInterval(timer);
 navigator.geolocation.clearWatch(watchId);
 audioCtx.close();
 alert('完成訓練');
}

function format(s){return Math.floor(s/60).toString().padStart(2,'0')+":"+(s%60).toString().padStart(2,'0');}
function haversine(a,b,c,d){
 const R=6371000;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 const x=Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// 模式切換
const sel=document.getElementById('modeSel');
sel.onchange=()=>{mode=sel.value;startPhase();}

// 長按
let pressTimer;
const btn=document.getElementById('stopBtn');
btn.onmousedown=btn.ontouchstart=()=>{pressTimer=setTimeout(stop,1200);btn.style.opacity=0.5};
btn.onmouseup=btn.onmouseleave=btn.ontouchend=()=>{clearTimeout(pressTimer);btn.style.opacity=1};

</script>

</body>
</html>
