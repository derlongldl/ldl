<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>跑步教練 V9.1.7</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root { --primary: #ff6a00; --bg: #f0f2f5; --card: #ffffff; --danger: #e74c3c; --success: #2ecc71; --info: #3498db; --dark: #2c3e50; --note: #9b59b6; }
body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 5px; }
.card { background: var(--card); border-radius: 12px; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 10px; }
h2 { text-align:center; color:var(--primary); margin:5px 0; font-size: 1.2rem; }
table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
th { background: #f8f9fa; padding: 8px 2px; border: 1px solid #dee2e6; color: #555; }
td { padding: 6px 2px; border: 1px solid #dee2e6; text-align: center; }
input[type="number"], input[type="text"] { width: 90%; padding: 6px 0; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
.pace-text { color: var(--primary); font-weight: bold; font-family: monospace; font-size: 1.1rem; }
.big-val { font-size: 6rem; font-weight: 900; color: var(--primary); font-family: monospace; line-height: 1; margin: 10px 0; }
.btn-action { padding: 18px; border: none; border-radius: 15px; font-size: 1.1rem; font-weight: bold; color: #fff; cursor: pointer; }
.btn-block { width: 100%; display: block; }
#trainingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; z-index: 10000; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
.bottom-bar { position: absolute; bottom: 30px; left: 20px; right: 20px; }
#mapModal, #noteModal, #rescueModal, #dbModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 30000; justify-content: center; align-items: center; }
#map { width: 100%; height: 80%; background: white; }
.note-box { background: white; width: 95%; max-height: 85vh; overflow-y: auto; border-radius: 15px; padding: 15px; color: #333; box-sizing: border-box; }
#noteArea, #rescueArea { width: 100%; height: 120px; margin-top: 10px; padding: 8px; font-size: 14px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
.history-card { background: white; border-radius: 10px; padding: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); }
.history-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.btn-sm { flex: 1; min-width: 55px; padding: 8px 2px; font-size: 11px; border-radius: 6px; border: none; color: white; font-weight: bold; cursor: pointer; }

.bpm-control { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; }
.btn-circle { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #fff; background: transparent; color: #fff; font-size: 1.5rem; cursor: pointer; }
.hold-btn-container { position: relative; width: 100%; height: 60px; overflow: hidden; border-radius: 15px; }
#holdProgress { position: absolute; left: 0; top: 0; height: 100%; background: rgba(255,255,255,0.3); width: 0%; pointer-events: none; }
.thres-input { width: 50px !important; padding: 4px 0 !important; font-size: 0.9rem !important; text-align: center; margin: 0 2px; }
.ratio-input { width: 45px !important; padding: 4px 0 !important; font-size: 0.9rem !important; text-align: center; margin: 0 2px; }
.mini-btn { padding: 4px 6px; font-size: 0.85rem; }
.inline-check { display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; }
.inline-check input { margin: 0 3px 0 0; }

.db-item { border: 1px solid #ccc; border-radius: 8px; padding: 8px; margin-bottom: 12px; background: #fff; }
.db-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; font-size: 1rem; margin-bottom: 6px; }
.btn-del-phase { background: var(--danger); color: white; border: none; border-radius: 4px; width: 22px; height: 22px; cursor: pointer; font-weight: bold; line-height: 1; }
</style>
</head>
<body>

<div id="dbModal">
    <div class="note-box">
        <h3 style="margin-top:0; color:var(--primary); text-align:center;">跑步計畫資料庫</h3>
        <div id="dbList"></div>
        <button onclick="addDbItem()" style="width:100%; padding:10px; background:var(--info); color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:8px;">＋ 新增預設資料</button>
        <button onclick="exportDataTxt()" style="width:100%; padding:10px; background:var(--note); color:white; border:none; border-radius:8px; font-weight:bold; margin-bottom:8px;">💾 匯出至 data.txt 備份</button>
        <button onclick="closeDbModal()" style="width:100%; padding:10px; background:#888; color:white; border:none; border-radius:8px;">關閉</button>
    </div>
</div>

<div id="noteModal"><div class="note-box"><h3>📝 訓練備註</h3><textarea id="noteArea"></textarea><div style="display:flex; gap:10px; margin-top:15px;"><button onclick="closeNote()" style="flex:1; padding:10px;">取消</button><button onclick="saveNote()" style="flex:1; padding:10px; background:var(--success); color:white; border:none; border-radius:8px;">儲存</button></div></div></div>

<div id="rescueModal"><div class="note-box" style="border: 3px solid var(--danger);"><h3 style="color:var(--danger); margin-top:0;">⚠️ 系統儲存失敗！已啟動救回機制</h3><p style="font-size:13px; color:#666;">因手機瀏覽器限制，無法寫入歷史紀錄。<strong>程式已自動將下方數據複製到您的剪貼簿</strong>。</p><textarea id="rescueArea" readonly onclick="this.select()"></textarea><button onclick="forceCloseRescue()" style="width:100%; margin-top:15px; padding:12px; background:var(--dark); color:white; border:none; border-radius:8px; font-weight:bold;">我已另存，關閉視窗</button></div></div>

<div id="mapModal" style="flex-direction:column;"><div id="map"></div><button onclick="closeMap()" style="padding:15px; width:100%; background:#444; color:white; border:none;">關閉軌跡</button></div>

<div id="trainingOverlay">
    <div id="statusTop" style="font-size:2rem; color:var(--success); font-weight:bold;">● 準備中</div>
    <div id="phaseDetail" style="font-size:1.2rem; color:#ffeb3b; margin: 5px 0;">--</div>
    <div id="bigDistance" class="big-val">0.000</div>
    <div id="soundIndicator" style="color:var(--info); font-size:0.9rem;">等待 GPS...</div>
    <div style="display:flex; width:100%; justify-content:space-around; margin: 10px 0; text-align:center;">
        <div><div style="color:#888; font-size:0.8rem;">平均配速</div><div id="bigPaceAvg" style="font-size:1.8rem; font-family:monospace;">--:--</div></div>
        <div><div style="color:#ffeb3b; font-size:0.8rem;">階段配速</div><div id="bigPaceCur" style="font-size:1.8rem; font-family:monospace; color:#ffeb3b;">--:--</div></div>
        <div><div style="color:#888; font-size:0.8rem;">跑步時間</div><div id="bigElapsed" style="font-size:1.8rem; font-family:monospace;">00:00</div></div>
    </div>

    <div class="bpm-control">
        <button class="btn-circle" onclick="adjLiveBPM(-1)">－</button>
        <div style="text-align:center;"><div style="font-size:0.8rem; color:#aaa;">當前節拍</div><div id="liveBPM" style="font-size:1.5rem; font-weight:bold;">180</div></div>
        <button class="btn-circle" onclick="adjLiveBPM(1)">＋</button>
    </div>

    <div class="bottom-bar">
        <div class="hold-btn-container">
            <div id="holdProgress"></div>
            <button id="btnStop" class="btn-action btn-block" style="background:var(--danger); position:relative; z-index:1;" 
                onmousedown="startHold(event)" onmouseup="endHold(event)" onmouseleave="endHold(event)"
                ontouchstart="startHold(event)" ontouchend="endHold(event)" ontouchcancel="endHold(event)">
                長按 1.5 秒結束並儲存
            </button>
        </div>
    </div>
</div>

<div class="card">
  <h2> V9.1.7</h2>
  <div>
      <table>
        <thead><tr><th>階段</th><th>BPM</th><th>秒數</th><th>距離(m)</th><th>跑速</th></tr></thead>
        <tbody id="configRows">
            <!-- 預設 DOM 展示，防止 JS 未載入時完全空白 -->
            <tr><td><b>1階</b></td><td><input type="number" id="bpm_0" value="180"></td><td><input type="number" id="sec_0" value="285"></td><td><input type="number" id="dist_0" value="1000"></td><td class="pace-text" id="pace_0">04:45</td></tr>
            <tr><td><b>2階</b></td><td><input type="number" id="bpm_1" value="190"></td><td><input type="number" id="sec_1" value="299"></td><td><input type="number" id="dist_1" value="1000"></td><td class="pace-text" id="pace_1">04:59</td></tr>
            <tr><td><b>3階</b></td><td><input type="number" id="bpm_2" value="195"></td><td><input type="number" id="sec_2" value="290"></td><td><input type="number" id="dist_2" value="1000"></td><td class="pace-text" id="pace_2">04:50</td></tr>
        </tbody>
      </table>
      <div class="control-row" style="display:flex; justify-content:space-between; align-items:center; margin:10px 0; font-size:12px;">
        <span>循環：<input id="loopStart" type="number" value="1" oninput="uiUpdate()" style="width:30px; padding:2px;">階至<input id="loopEnd" type="number" value="3" oninput="uiUpdate()" style="width:30px; padding:2px;">階，<input id="loopCount" type="number" value="1" oninput="uiUpdate()" style="width:35px; padding:2px;">組</span>
        <span>預計：<b id="totalPlanTime">14.6</b>分 / <b id="totalPlanDist">3.00</b>km</span>
      </div>
  </div>

  <div style="display:flex; gap:10px; margin-top:10px;">
      <button onclick="toggleStart(true)" class="btn-action" style="background:var(--primary); flex:1;">1 達標儲存</button>
      <button onclick="toggleStart(false)" class="btn-action" style="background:var(--info); flex:1;">2 達標續跑</button>
  </div>
  <button onclick="openDbModal()" style="width:100%; margin-top:10px; padding:10px; background:#ddd; border:none; border-radius:8px; color:#333; font-size:14px; font-weight:bold;">📂 載入 / 管理預設資料庫</button>

  <div class="control-row" style="border-top:1px dashed #ccc; margin-top:12px; padding-top:10px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <span>警示音：</span>
      <label class="inline-check">
        <input type="checkbox" id="alarmToggle" checked onchange="toggleAlarm(this.checked)">開啟
      </label>
    </div>
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <span>距離比例：</span>
      <button class="mini-btn" onclick="adjRatio(-1)">－</button>
      <input type="number" id="ratioInput" class="ratio-input" value="100" step="1" min="1" max="200" oninput="manualRatioChange(this.value)">%
      <button class="mini-btn" onclick="adjRatio(1)">＋</button>
    </div>
  </div>

  <div class="control-row" style="margin-top:8px; display:flex; justify-content:space-between; align-items:center; font-size:0.85rem;">
    <span>GPS門檻：</span>
    <div style="display:flex; align-items:center; white-space:nowrap;">
      <button class="mini-btn" onclick="adjThres(-0.01)">－</button>
      <input type="number" id="thresInput" class="thres-input" value="1.81" step="0.01" min="0.01" oninput="manualThresChange(this.value)"> m
      <button class="mini-btn" onclick="adjThres(0.01)">＋</button>
    </div>
  </div>
</div>

<div class="card"><strong>歷史紀錄</strong><div id="historyContainer"></div></div>

<script>
var CONFIG_KEY = 'run_config_v917';
var HISTORY_KEY = 'run_history_v917';
var DB_KEY = 'run_db_v917';

// 預設資料庫 (改用 JavaScript 物件結構，100% 避開字串解析問題)
var DEFAULT_DB = [
    { name: "10K漸速跑", items: [{bpm:180,sec:420,dist:1000},{bpm:180,sec:1080,dist:3000},{bpm:185,sec:1005,dist:3000},{bpm:190,sec:945,dist:3000},{bpm:190,sec:300,dist:1000}], loopStart: 1, loopEnd: 5, loops: 1 },
    { name: "超慢跑旋轉功", items: [{bpm:180,sec:1200,dist:1750},{bpm:180,sec:1200,dist:1750}], loopStart: 1, loopEnd: 2, loops: 1 },
    { name: "6K輕鬆跑", items: [{bpm:180,sec:420,dist:1000},{bpm:180,sec:2580,dist:7000}], loopStart: 1, loopEnd: 2, loops: 1 },
    { name: "13K漸速跑", items: [{bpm:180,sec:420,dist:1000},{bpm:180,sec:360,dist:3000},{bpm:185,sec:1360,dist:4000},{bpm:190,sec:1280,dist:4000},{bpm:190,sec:620,dist:2000}], loopStart: 1, loopEnd: 5, loops: 1 },
    { name: "挪威4*4", items: [{bpm:180,sec:420,dist:1000},{bpm:190,sec:240,dist:820},{bpm:180,sec:180,dist:820},{bpm:180,sec:420,dist:1000}], loopStart: 2, loopEnd: 3, loops: 4 },
    { name: "亞索800", items: [{bpm:180,sec:180,dist:400},{bpm:190,sec:115,dist:400},{bpm:180,sec:180,dist:400}], loopStart: 2, loopEnd: 3, loops: 10 },
    { name: "6K賽事", items: [{bpm:190,sec:285,dist:1000},{bpm:190,sec:295,dist:1000},{bpm:190,sec:290,dist:1000}], loopStart: 1, loopEnd: 3, loops: 2 },
    { name: "10K賽事", items: [{bpm:180,sec:285,dist:1000},{bpm:190,sec:299,dist:1000},{bpm:195,sec:290,dist:1000}], loopStart: 1, loopEnd: 3, loops: 1 },
    { name: "半馬賽事", items: [{bpm:180,sec:1800,dist:5000},{bpm:185,sec:1725,dist:5000},{bpm:185,sec:1650,dist:5000},{bpm:185,sec:1700,dist:5000},{bpm:190,sec:330,dist:1000}], loopStart: 1, loopEnd: 5, loops: 1 }
];

var isRunning = false, totalDist = 0, elapsedSec = 0;
var audioCtx = null, timerId = null, watchId = null, trackPoints = [];
var lastDistCheck = 0, distStallCount = 0, currentSoundType = true;
var startNote = { location: "偵測中", weather: "偵測中" };
var lastKmDist = 0, lastKmSec = 0, currentRunningBPM = 180;
var holdTimer = null, holdPercent = 0;

var config = {
    items: [
        { bpm:180, sec:285, dist:1000 },
        { bpm:190, sec:299, dist:1000 },
        { bpm:195, sec:290, dist:1000 }
    ],
    loopStart: 1,
    loopEnd: 3,
    loops: 1,
    threshold: 1.81,
    distRatio: 100,
    alarmOn: true
};

var currentPhaseName = "";
var currentLoopIndex = 0;
var phaseRecords = [];
var currentPhaseStartDist = 0, currentPhaseStartSec = 0;

function getAudioContext() {
    if (!audioCtx) {
        var AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) audioCtx = new AudioContextClass();
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

function init() {
    try { initDatabase(); } catch(e){ console.error(e); }

    try {
        var saved = localStorage.getItem(CONFIG_KEY);
        if (saved) {
            var parsed = JSON.parse(saved);
            if (parsed && Array.isArray(parsed.items) && parsed.items.length > 0) {
                config = parsed;
            }
        }
    } catch(e) { console.error(e); }

    if (!config.items || !Array.isArray(config.items) || config.items.length === 0) {
        config.items = [
            { bpm:180, sec:285, dist:1000 },
            { bpm:190, sec:299, dist:1000 },
            { bpm:195, sec:290, dist:1000 }
        ];
    }

    try { renderMainTable(); } catch(e){}
    try { fillSettingsForm(); } catch(e){}
    try { uiUpdate(); } catch(e){}
    try { renderHistory(); } catch(e){}
}

function initDatabase() {
    try {
        var existingDb = localStorage.getItem(DB_KEY);
        if (!existingDb) {
            localStorage.setItem(DB_KEY, JSON.stringify(DEFAULT_DB));
        }
    } catch(e) { console.error("DB Init Err", e); }
}

function exportDataTxt() {
    try {
        var db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
        var lines = db.map(function(entry) {
            var row = [entry.name];
            entry.items.forEach(function(it) { row.push(it.bpm, it.sec, it.dist); });
            return row.join(',');
        });
        var blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8;' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'data.txt';
        a.click();
    } catch(e) { alert("匯出失敗：" + e.message); }
}

function renderMainTable() {
    var html = "";
    config.items.forEach(function(it, i) {
        var pLabel = (i+1) + "階";
        html += '<tr>' +
            '<td><b>' + pLabel + '</b></td>' +
            '<td><input type="number" id="bpm_' + i + '" value="' + (it.bpm||180) + '" oninput="uiUpdate()"></td>' +
            '<td><input type="number" id="sec_' + i + '" value="' + (it.sec||300) + '" oninput="uiUpdate()"></td>' +
            '<td><input type="number" id="dist_' + i + '" value="' + (it.dist||1000) + '" oninput="uiUpdate()"></td>' +
            '<td class="pace-text" id="pace_' + i + '">--</td>' +
        '</tr>';
    });
    var el = document.getElementById('configRows');
    if (el) el.innerHTML = html;
}

function fillSettingsForm() {
    var elLS = document.getElementById('loopStart');
    var elLE = document.getElementById('loopEnd');
    var elLC = document.getElementById('loopCount');
    var elTH = document.getElementById('thresInput');
    var elRA = document.getElementById('ratioInput');
    var elAL = document.getElementById('alarmToggle');

    if(elLS) elLS.value = config.loopStart || 1;
    if(elLE) elLE.value = config.loopEnd || config.items.length;
    if(elLC) elLC.value = config.loops || 1;
    if(elTH) elTH.value = (config.threshold||1.81).toFixed(2);
    if(elRA) elRA.value = config.distRatio||100;
    if(elAL) elAL.checked = config.alarmOn !== false;
}

function uiUpdate() {
    if(!config.items) return;
    config.items.forEach(function(it, i) {
        var b = document.getElementById('bpm_' + i), s = document.getElementById('sec_' + i), d = document.getElementById('dist_' + i);
        if(b) it.bpm = +b.value; 
        if(s) it.sec = +s.value; 
        if(d) it.dist = +d.value;
        
        if(it.sec > 0 && it.dist > 0) {
            var pEl = document.getElementById('pace_' + i);
            if(pEl) pEl.innerText = formatTime(Math.floor(it.sec / (it.dist/1000)));
        }
    });

    var totalPhases = config.items.length;
    var elLS = document.getElementById('loopStart'), elLE = document.getElementById('loopEnd'), elLC = document.getElementById('loopCount');
    var lStart = elLS ? Math.max(1, Math.min(totalPhases, +elLS.value||1)) : 1;
    var lEnd = elLE ? Math.max(lStart, Math.min(totalPhases, +elLE.value||totalPhases)) : totalPhases;
    var lCount = elLC ? Math.max(1, +elLC.value||1) : 1;

    config.loopStart = lStart;
    config.loopEnd = lEnd;
    config.loops = lCount;

    var totalPlanSec = 0, totalPlanDist = 0;
    for (var i = 0; i < lStart - 1; i++) {
        if(config.items[i]) { totalPlanSec += config.items[i].sec; totalPlanDist += config.items[i].dist; }
    }
    var loopSec = 0, loopDist = 0;
    for (var i = lStart - 1; i < lEnd; i++) {
        if(config.items[i]) { loopSec += config.items[i].sec; loopDist += config.items[i].dist; }
    }
    totalPlanSec += loopSec * lCount;
    totalPlanDist += loopDist * lCount;
    for (var i = lEnd; i < totalPhases; i++) {
        if(config.items[i]) { totalPlanSec += config.items[i].sec; totalPlanDist += config.items[i].dist; }
    }
    
    var elTPT = document.getElementById('totalPlanTime'), elTPD = document.getElementById('totalPlanDist');
    if (elTPT) elTPT.innerText = (totalPlanSec / 60).toFixed(1);
    if (elTPD) elTPD.innerText = (totalPlanDist / 1000).toFixed(2);
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch(e){}
}

function openDbModal() { renderDbList(); document.getElementById('dbModal').style.display = 'flex'; }
function closeDbModal() { document.getElementById('dbModal').style.display = 'none'; }

function renderDbList() {
    var listContainer = document.getElementById('dbList');
    if (!listContainer) return;
    listContainer.innerHTML = "";
    var db = JSON.parse(localStorage.getItem(DB_KEY) || "[]");
    
    db.forEach(function(entry, idx) {
        var div = document.createElement('div');
        div.className = 'db-item';
        var rowsHtml = entry.items.map(function(it, i) {
            var pace = (it.sec > 0 && it.dist > 0) ? formatTime(Math.floor(it.sec / (it.dist/1000))) : '--';
            return '<tr>' +
                '<td style="display:flex; align-items:center; justify-content:center; gap:2px; border:none; padding:4px 0;">' +
                    '<button class="btn-del-phase" onclick="deleteDbPhase(' + idx + ',' + i + ')" title="刪除">✕</button>' +
                    '<b>' + (i+1) + '階</b>' +
                '</td>' +
                '<td><input type="number" value="' + it.bpm + '" onchange="updateDbItem(' + idx + ',' + i + ',\'bpm\',this.value)"></td>' +
                '<td><input type="number" value="' + it.sec + '" onchange="updateDbItem(' + idx + ',' + i + ',\'sec\',this.value)"></td>' +
                '<td><input type="number" value="' + it.dist + '" onchange="updateDbItem(' + idx + ',' + i + ',\'dist\',this.value)"></td>' +
                '<td class="pace-text">' + pace + '</td>' +
            '</tr>';
        }).join('');
        
        div.innerHTML = 
            '<div class="db-header">' +
                '<span><input type="text" value="' + entry.name + '" style="width:130px; font-weight:bold;" onchange="updateDbName(' + idx + ', this.value)"></span>' +
                '<div>' +
                    '<button onclick="loadDbItem(' + idx + ')" style="background:var(--success); color:white; border:none; padding:6px 12px; border-radius:5px; font-weight:bold; cursor:pointer;">載入</button> ' +
                    '<button onclick="deleteDbItem(' + idx + ')" style="background:var(--danger); color:white; border:none; padding:6px 10px; border-radius:5px; cursor:pointer;">刪除</button>' +
                '</div>' +
            '</div>' +
            '<table>' +
                '<thead><tr><th style="width:25%;">階段</th><th>BPM</th><th>秒數</th><th>距離(m)</th><th>配速</th></tr></thead>' +
                '<tbody>' + rowsHtml + '</tbody>' +
            '</table>' +
            '<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px;">' +
                '<button onclick="addDbPhase(' + idx + ')" style="padding:4px 8px; background:var(--info); color:white; border:none; border-radius:4px; font-size:12px; cursor:pointer;">＋ 新增階段</button>' +
                '<span>循環：<input type="number" value="' + (entry.loopStart||1) + '" style="width:30px; padding:2px;" onchange="updateDbLoopRange(' + idx + ',\'loopStart\',this.value)">階~<input type="number" value="' + (entry.loopEnd||entry.items.length) + '" style="width:30px; padding:2px;" onchange="updateDbLoopRange(' + idx + ',\'loopEnd\',this.value)">階，<input type="number" value="' + (entry.loops||1) + '" style="width:35px; padding:2px;" onchange="updateDbLoopRange(' + idx + ',\'loops\',this.value)">組</span>' +
            '</div>';
        listContainer.appendChild(div);
    });
}

function updateDbName(idx, val) { var db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx].name = val; localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function updateDbLoopRange(idx, field, val) { var db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx][field] = Math.max(1, Number(val)); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function updateDbItem(idx, phaseIdx, field, val) { var db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx].items[phaseIdx][field] = Number(val); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }

function addDbPhase(idx) { var db = JSON.parse(localStorage.getItem(DB_KEY)); db[idx].items.push({ bpm: 180, sec: 300, dist: 1000 }); db[idx].loopEnd = db[idx].items.length; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function deleteDbPhase(idx, phaseIdx) { var db = JSON.parse(localStorage.getItem(DB_KEY)); if (db[idx].items.length <= 1) { alert("至少需要保留一個階段！"); return; } db[idx].items.splice(phaseIdx, 1); if (db[idx].loopEnd > db[idx].items.length) db[idx].loopEnd = db[idx].items.length; if (db[idx].loopStart > db[idx].items.length) db[idx].loopStart = db[idx].items.length; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function loadDbItem(idx) { var db = JSON.parse(localStorage.getItem(DB_KEY)); var item = db[idx]; config.items = JSON.parse(JSON.stringify(item.items)); config.loopStart = item.loopStart || 1; config.loopEnd = item.loopEnd || config.items.length; config.loops = item.loops || 1; renderMainTable(); fillSettingsForm(); uiUpdate(); closeDbModal(); }

function addDbItem() { var db = JSON.parse(localStorage.getItem(DB_KEY)); db.push({ name: "新預設計畫", items: [{ bpm: 180, sec: 300, dist: 1000 }, { bpm: 180, sec: 300, dist: 1000 }], loopStart: 1, loopEnd: 2, loops: 1 }); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }
function deleteDbItem(idx) { if(!confirm("確定要刪除這筆預設計畫？")) return; var db = JSON.parse(localStorage.getItem(DB_KEY)); db.splice(idx, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderDbList(); }

function manualThresChange(v) { var num = parseFloat(v); if (!isNaN(num) && num > 0) { config.threshold = num; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } }
function adjThres(v) { config.threshold = Math.max(0.01, parseFloat(((config.threshold||1.81) + v).toFixed(2))); document.getElementById('thresInput').value = config.threshold.toFixed(2); localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }
function manualRatioChange(v) { var num = parseInt(v); if (!isNaN(num) && num > 0) { config.distRatio = num; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } }
function adjRatio(v) { config.distRatio = Math.max(1, (config.distRatio||100) + v); document.getElementById('ratioInput').value = config.distRatio; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

function toggleStart(isAuto) {
    if (isRunning) return; 
    isRunning = true; totalDist = 0; elapsedSec = 0; trackPoints = []; 
    lastDistCheck = 0; distStallCount = 0; lastKmDist = 0; lastKmSec = 0;
    phaseRecords = []; currentPhaseName = "";
    
    document.getElementById('trainingOverlay').style.display = 'flex';
    getAudioContext();
    
    timerId = setInterval(function() {
        if (!isRunning) return;
        elapsedSec++;
        document.getElementById('bigElapsed').innerText = formatTime(elapsedSec);
        
        if(totalDist > 5) {
            document.getElementById('bigPaceAvg').innerText = formatTime(Math.floor(elapsedSec/(totalDist/1000)));
            var pDiffDist = (totalDist - currentPhaseStartDist) / 1000;
            var pDiffSec = elapsedSec - currentPhaseStartSec;
            if (pDiffDist > 0.003 && pDiffSec > 0) {
                document.getElementById('bigPaceCur').innerText = formatTime(Math.floor(pDiffSec / pDiffDist));
            }
        }
        
        if (totalDist <= lastDistCheck && elapsedSec > 10) { 
            distStallCount++; 
            if (distStallCount >= 5) { triggerAlarm(); distStallCount = 0; } 
        } else { lastDistCheck = totalDist; distStallCount = 0; }
    }, 1000);

    startGPS();
    runBeepLoop();
    startRunnerSequence(isAuto);
}

function startRunnerSequence(isAuto) {
    var lStart = config.loopStart - 1;
    var lEnd = config.loopEnd - 1;
    var lCount = config.loops || 1;

    var chain = Promise.resolve();

    for (var i = 0; i < lStart; i++) {
        (function(idx){
            chain = chain.then(function(){
                if (!isRunning) return;
                var item = config.items[idx];
                return runPhase((idx+1) + "階", item.sec, item.bpm, 0, 1);
            });
        })(i);
    }

    for (var l = 0; l < lCount; l++) {
        (function(loopIdx){
            for (var i = lStart; i <= lEnd; i++) {
                (function(idx){
                    chain = chain.then(function(){
                        if (!isRunning) return;
                        currentLoopIndex = loopIdx;
                        var item = config.items[idx];
                        return runPhase((idx+1) + "階", item.sec, item.bpm, loopIdx, lCount);
                    });
                })(i);
            }
        })(l);
    }

    for (var i = lEnd + 1; i < config.items.length; i++) {
        (function(idx){
            chain = chain.then(function(){
                if (!isRunning) return;
                var item = config.items[idx];
                return runPhase((idx+1) + "階", item.sec, item.bpm, 0, 1);
            });
        })(i);
    }

    chain.then(function(){
        if(isRunning) {
            if (isAuto) {
                stopAndSave(); 
            } else {
                document.getElementById('statusTop').innerText = "● 續跑中";
                currentPhaseName = "續跑";
                currentPhaseStartDist = totalDist;
                currentPhaseStartSec = elapsedSec;
                document.getElementById('phaseDetail').innerText = "訓練達標 | 續跑中...";
            }
        }
    });
}

function runBeepLoop() {
    if(!isRunning) return;
    var startTime = Date.now();
    playBeepTick();
    var execTime = Date.now() - startTime;
    var delay = Math.max(10, (60000 / currentRunningBPM) - execTime);
    setTimeout(runBeepLoop, delay);
}

function runPhase(label, sec, bpm, loopIdx, totalLoops) {
    return new Promise(function(resolve) {
        if(!isRunning) return resolve();

        document.getElementById('statusTop').innerText = "● " + label;
        currentRunningBPM = bpm;
        document.getElementById('liveBPM').innerText = currentRunningBPM;
        currentSoundType = !currentSoundType;
        
        currentPhaseName = label;
        currentPhaseStartDist = totalDist;
        currentPhaseStartSec = elapsedSec;
        
        var remSec = sec;
        var phaseTimer = setInterval(function() {
            if (!isRunning) {
                clearInterval(phaseTimer);
                return resolve();
            }
            remSec--;
            var loopText = (totalLoops > 1) ? ' (組' + (loopIdx+1) + '/' + totalLoops + ')' : '';
            document.getElementById('phaseDetail').innerText = '節拍:' + currentRunningBPM + loopText + ' | 剩:' + remSec + 's';
            if (remSec <= 0) {
                clearInterval(phaseTimer);
                recordPhaseResult();
                resolve();
            }
        }, 1000);
    });
}

function recordPhaseResult() {
    var pDist = totalDist - currentPhaseStartDist;
    var pSec = elapsedSec - currentPhaseStartSec;
    if (pDist > 0 && pSec > 0) {
        phaseRecords.push({
            name: currentPhaseName,
            loopIdx: currentLoopIndex,
            dist: pDist,
            sec: pSec
        });
    }
}

function playBeepTick() {
    if(!isRunning) return;
    try {
        var ctx = getAudioContext();
        if(!ctx) return;
        var o = ctx.createOscillator(), g = ctx.createGain(); 
        o.connect(g); g.connect(ctx.destination);
        var km = Math.floor(totalDist / 1000); 
        if (km > (lastKmDist/1000)) { lastKmDist = km * 1000; lastKmSec = elapsedSec; }
        var isHigh = (km % 2 === 0) ? currentSoundType : !currentSoundType;
        o.type = 'square'; 
        o.frequency.setValueAtTime(isHigh ? 1150 : 850, ctx.currentTime);
        g.gain.setValueAtTime(isHigh ? 0.3 : 0.5, ctx.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        
        o.onended = function() { try { o.disconnect(); g.disconnect(); } catch(e){} };
        o.start(ctx.currentTime); 
        o.stop(ctx.currentTime + 0.1);
        
        var indText = '第 ' + (km+1) + 'k | ' + (isHigh?'高音':'低音') + ' | 里程:' + (totalDist/1000).toFixed(3) + 'k';
        document.getElementById('soundIndicator').innerText = indText;
    } catch(e) {}
}

function adjLiveBPM(v) { currentRunningBPM += v; document.getElementById('liveBPM').innerText = currentRunningBPM; }

function triggerAlarm() { 
    if(!config.alarmOn || !isRunning) return;
    try {
        if (navigator.vibrate) navigator.vibrate([400, 150, 400]); 
        var ctx = getAudioContext();
        if (!ctx) return;
        var o = ctx.createOscillator(), g = ctx.createGain(); 
        o.connect(g); g.connect(ctx.destination); 
        o.frequency.setValueAtTime(1600, ctx.currentTime); 
        o.type = 'sawtooth'; 
        g.gain.setValueAtTime(0.4, ctx.currentTime); 
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        
        o.onended = function() { try { o.disconnect(); g.disconnect(); } catch(e){} };
        o.start(ctx.currentTime); 
        o.stop(ctx.currentTime + 0.4);
    } catch(e) {}
}

function startHold(e) {
    if(e) { e.preventDefault(); if (e.touches && e.touches.length > 1) return; }
    clearInterval(holdTimer); 
    holdPercent = 0;
    document.getElementById('holdProgress').style.width = '0%';
    
    holdTimer = setInterval(function() {
        if (!isRunning) { clearInterval(holdTimer); return; }
        holdPercent += 4; 
        document.getElementById('holdProgress').style.width = holdPercent + '%';
        if(holdPercent >= 100) { 
            clearInterval(holdTimer); 
            holdPercent = 0;
            document.getElementById('holdProgress').style.width = '0%';
            stopAndSave(); 
        }
    }, 60); 
}

function endHold(e) { if(e) e.preventDefault(); clearInterval(holdTimer); holdPercent = 0; document.getElementById('holdProgress').style.width = '0%'; }

function startGPS() {
    if (!navigator.geolocation) return;
    watchId = navigator.geolocation.watchPosition(function(p) {
        var lat = p.coords.latitude, lon = p.coords.longitude, accuracy = p.coords.accuracy;
        if(accuracy < 60) {
            var nowStr = new Date().toISOString();
            if(trackPoints.length === 0) {
                fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lon).then(function(res){return res.json();}).then(function(d){startNote.location=d.display_name.split(',')[0];}).catch(function(){});
                fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true').then(function(res){return res.json();}).then(function(d){startNote.weather=d.current_weather.temperature+'°C';}).catch(function(){});
                trackPoints.push({lat: lat, lon: lon, time: nowStr});
            } else {
                var last = trackPoints[trackPoints.length-1], d = haversine(last.lat, last.lon, lat, lon);
                if(d > config.threshold && d < 50) { 
                    var adjustedDist = d * ((config.distRatio || 100) / 100);
                    totalDist += adjustedDist; 
                    document.getElementById('bigDistance').innerText = (totalDist/1000).toFixed(3); 
                    trackPoints.push({lat: lat, lon: lon, time: nowStr}); 
                }
            }
        }
    }, null, {enableHighAccuracy:true});
}

function formatPaceStr(sec) {
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60).toString();
    if(s.length < 2) s = '0' + s;
    return m + '’' + s;
}

function stopAndSave() {
    if (!isRunning) return;
    isRunning = false; 
    clearInterval(timerId); 
    timerId = null; 
    if (navigator.geolocation && watchId) navigator.geolocation.clearWatch(watchId);
    
    if (currentPhaseName !== "") {
        recordPhaseResult();
        currentPhaseName = "";
    }

    var optimizedPoints = [];
    if (trackPoints.length > 0) {
        optimizedPoints.push(trackPoints[0]);
        for (var i = 1; i < trackPoints.length; i++) {
            var lastSaved = optimizedPoints[optimizedPoints.length - 1];
            var distDiff = haversine(lastSaved.lat, lastSaved.lon, trackPoints[i].lat, trackPoints[i].lon);
            var timeDiff = (new Date(trackPoints[i].time) - new Date(lastSaved.time)) / 1000;
            if (distDiff >= 6.0 || timeDiff >= 12 || i === trackPoints.length - 1) {
                optimizedPoints.push(trackPoints[i]);
            }
        }
    }

    var paceDetailLines = calculatePaceSummary(phaseRecords);
    var paceStrText = paceDetailLines.join('\n');
    var autoNote = '📍地點：' + startNote.location + '\n🌡氣候：' + startNote.weather + '\n⚙️門檻：' + config.threshold.toFixed(2) + 'm' + (paceStrText ? '\n' + paceStrText : '');

    var runInfo = {
        id: Date.now(), 
        date: new Date().toLocaleString(), 
        dist: (totalDist/1000).toFixed(3), 
        time: formatTime(elapsedSec), 
        points: optimizedPoints, 
        note: autoNote
    };

    if(totalDist > 0) {
        try {
            var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
            recs.unshift(runInfo);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(recs));
            
            alert('🎉 訓練達標！紀錄已成功儲存：' + runInfo.dist + ' km');
            document.getElementById('trainingOverlay').style.display = 'none';
            renderHistory();
        } catch (e) {
            var rescueString = JSON.stringify(runInfo);
            document.getElementById('rescueArea').value = rescueString;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(rescueString).catch(function(){});
            }
            document.getElementById('rescueModal').style.display = 'flex';
        }
    } else {
        document.getElementById('trainingOverlay').style.display = 'none';
        renderHistory();
    }
}

function calculatePaceSummary(records) {
    if (records.length === 0) return [];

    var groups = {};
    records.forEach(function(r) {
        if (!groups[r.name]) groups[r.name] = [];
        groups[r.name].push(r);
    });

    var lines = [];
    Object.keys(groups).forEach(function(pName) {
        var items = groups[pName];
        if (items.length === 1) {
            var avgPaceSec = items[0].sec / (items[0].dist / 1000);
            lines.push(pName + '：' + formatPaceStr(avgPaceSec));
        } else {
            var paces = items.map(function(it) { return it.sec / (it.dist / 1000); });
            var minPace = Math.min.apply(null, paces);
            var maxPace = Math.max.apply(null, paces);
            lines.push(pName + '：' + formatPaceStr(minPace) + '~' + formatPaceStr(maxPace));
        }
    });

    return lines;
}

function forceCloseRescue() {
    document.getElementById('rescueModal').style.display = 'none';
    document.getElementById('trainingOverlay').style.display = 'none';
    renderHistory();
}

function renderHistory() {
    try {
        var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        var container = document.getElementById('historyContainer');
        if (!container) return;
        container.innerHTML = recs.map(function(r) {
            return '<div class="history-card">' +
                '<b>🏃 ' + r.dist + ' km | ' + r.time + '</b> (' + r.date + ')' +
                '<div style="font-size:11px; color:#666; margin:5px 0; white-space:pre-wrap;">' + (r.note || '無') + '</div>' +
                '<div class="history-btns">' +
                    '<button class="btn-sm" style="background:var(--info);" onclick="viewTrack(' + r.id + ')">軌跡</button>' +
                    '<button class="btn-sm" style="background:var(--note);" onclick="editNote(' + r.id + ')">備註</button>' +
                    '<button class="btn-sm" style="background:var(--success);" onclick="editDist(' + r.id + ')">修正</button>' +
                    '<button class="btn-sm" style="background:var(--dark);" onclick="exportGPX(' + r.id + ')">匯出</button>' +
                    '<button class="btn-sm" style="background:var(--danger);" onclick="deleteRec(' + r.id + ')">刪除</button>' +
                '</div>' +
            '</div>';
        }).join('');
    } catch(e) {}
}

function exportGPX(id) {
    var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    var r = recs.find(function(x){ return x.id === id; }); 
    if(!r || !r.points) return;
    var gpx = '<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="RunCoach"><trk><trkseg>';
    r.points.forEach(function(p) { gpx += '<trkpt lat="' + p.lat + '" lon="' + p.lon + '"><time>' + p.time + '</time></trkpt>'; });
    gpx += '</trkseg></trk></gpx>';
    var blob = new Blob([gpx], {type: 'application/gpx+xml'}), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Run_' + r.id + '.gpx'; a.click();
}

var curEditId = null;
function editNote(id) { curEditId = id; var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); var r = recs.find(function(x){ return x.id === id; }); document.getElementById('noteArea').value = r.note||""; document.getElementById('noteModal').style.display='flex'; }
function saveNote() { var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); var r = recs.find(function(x){ return x.id === curEditId; }); if(r) r.note = document.getElementById('noteArea').value; localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); closeNote(); renderHistory(); }
function closeNote() { document.getElementById('noteModal').style.display='none'; }
function editDist(id) { var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]"); var idx = recs.findIndex(function(x){ return x.id === id; }); var newVal = prompt("修正里程 (km):", recs[idx].dist); if(newVal) { recs[idx].dist = parseFloat(newVal).toFixed(3); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }
function toggleAlarm(val){ config.alarmOn = val; localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); }

function formatTime(s) { if(!s||s<=0) return "00:00"; var m = Math.floor(s/60).toString(), sec = (s%60).toString(); if(m.length < 2) m = '0'+m; if(sec.length < 2) sec = '0'+sec; return m + ":" + sec; }
function haversine(lat1,lon1,lat2,lon2) { var R=6371000; var dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180; var a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }

var map = null, polyline = null;
function viewTrack(id) {
    var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    var r = recs.find(function(x){ return x.id === id; });
    if (!r || !r.points || r.points.length === 0) return;
    document.getElementById('mapModal').style.display = 'flex';
    setTimeout(function() {
        if (!map) { map = L.map('map').setView([r.points[0].lat, r.points[0].lon], 16); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
        map.invalidateSize(); if (polyline) map.removeLayer(polyline);
        polyline = L.polyline(r.points.map(function(p){ return [p.lat, p.lon]; }), { color: '#ff6a00', weight: 5 }).addTo(map); map.fitBounds(polyline.getBounds());
    }, 300);
}
function closeMap() { document.getElementById('mapModal').style.display = 'none'; }
function deleteRec(id) { if(confirm("刪除紀錄？")) { var recs = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]").filter(function(x){ return x.id !== id; }); localStorage.setItem(HISTORY_KEY, JSON.stringify(recs)); renderHistory(); } }

// 安全啟動入口
window.onload = function() {
    init();
};
